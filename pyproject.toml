[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pylmm"
version = "0.99"
description = "pyLMM is a lightweight linear mixed model solver for use in GWAS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Furlotte", email = "nick.furlotte@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/nickFurlotte/pylmm"

[project.scripts]
pylmmGWAS = "pylmm.cli.gwas:main"
pylmmKinship = "pylmm.cli.kinship:main"

[dependency-groups]
dev = [
    "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["pylmm"]

[tool.hatch.build.targets.sdist]
exclude = ["/data", "/docker", "/docs", "/tests/golden", "/.github"]
