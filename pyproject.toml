[build-system]
# 1.27: first hatchling that accepts the PEP 639 `license-files` list form.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pylmm"
version = "0.99"
description = "pyLMM is a lightweight linear mixed model solver for use in GWAS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Furlotte", email = "nick.furlotte@gmail.com" }]
requires-python = ">=3.10"
# Lower bounds are the oldest versions that are tested: CI runs
# `uv run --python 3.10 --resolution lowest-direct pytest` on ubuntu, which
# installs numpy 1.22.0 + scipy 1.9.0; the same pins also pass on macOS arm64.
# scipy 1.8.0 and 1.8.1 have py3.10 macOS arm64 wheels but segfault in the
# suite there, hence scipy>=1.9.  numpy 1.22.0 passes on both platforms; older
# numpy is untested.  Only py3.10 has wheels this old, so newer Pythons
# resolve newer releases anyway.
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/nickFurlotte/pylmm"

[project.scripts]
pylmmGWAS = "pylmm.cli.gwas:main"
pylmmKinship = "pylmm.cli.kinship:main"

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff==0.15.*",
]
sims = [
    "matplotlib>=3.5",
    "pandas>=1.4",
    "statsmodels>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["pylmm"]

[tool.hatch.build.targets.sdist]
# tests/ needs tests/golden and data/ (~215MB), and scripts/ only holds
# source-checkout shims, so the sdist ships the package alone.
exclude = ["/data", "/docker", "/docs", "/tests", "/scripts", "/.github"]

[tool.ruff]
line-length = 100
# Moves to py311 at the 3.11 cutover; keep py310 until then.
target-version = "py310"
extend-exclude = [
    # Runs under the Python 2.7 baseline image (docker/py27/); must stay py2-valid.
    "tests/golden/generate_golden.py",
    "tests/golden/py2_original",
    "data",
]

[tool.ruff.lint]
# N (pep8-naming) is deliberately NOT enabled yet: the snake_case rename is
# Phase 5.4, which enables N at the same time.
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "NPY",     # numpy
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
    "PERF",    # perflint
    "PT",      # pytest style
]
ignore = []
