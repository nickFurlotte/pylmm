[build-system]
# 1.27: first hatchling that accepts the PEP 639 `license-files` list form.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pylmm"
version = "0.99"
description = "pyLMM is a lightweight linear mixed model solver for use in GWAS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Furlotte", email = "nick.furlotte@gmail.com" }]
requires-python = ">=3.10"
# Lower bounds are the oldest versions that are tested: CI runs
# `uv run --python 3.10 --resolution lowest-direct pytest` on ubuntu, which
# installs numpy 1.22.0 + scipy 1.9.0; the same pins also pass on macOS arm64.
# scipy 1.8.0 and 1.8.1 have py3.10 macOS arm64 wheels but segfault in the
# suite there, hence scipy>=1.9.  numpy 1.22.0 passes on both platforms; older
# numpy is untested.  Only py3.10 has wheels this old, so newer Pythons
# resolve newer releases anyway.
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/nickFurlotte/pylmm"

[project.scripts]
pylmm = "pylmm.cli:main"

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff==0.15.*",
    "mypy==2.4.0",
]
sims = [
    "matplotlib>=3.5",
    "pandas>=1.4",
    "statsmodels>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["pylmm"]

[tool.hatch.build.targets.sdist]
# tests/ needs tests/golden and data/ (~215MB), and scripts/ only holds
# the example script, so the sdist ships the package alone.
exclude = ["/data", "/docker", "/docs", "/tests", "/scripts", "/.github"]

[tool.mypy]
# The whole package, including the command line (pylmm/cli/).  numpy ships its own stubs; scipy has none (the
# third-party scipy-stubs package requires a newer numpy than the
# numpy>=1.22 floor), so its imports are untyped.  Run it under Python 3.10
# (`just typecheck`): numpy >= 2.3, which the lock resolves for newer
# Pythons, ships stubs that do not support python_version = "3.10".
files = ["pylmm"]
python_version = "3.10"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# matplotlib (sims group only) is imported lazily by LMM.plot_fit.
module = ["scipy", "scipy.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
# Moves to py311 at the 3.11 cutover; keep py310 until then.
target-version = "py310"
extend-exclude = [
    # Runs under the Python 2.7 baseline image (docker/py27/); must stay py2-valid.
    "tests/golden/generate_golden.py",
    "tests/golden/py2_original",
    "data",
]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "NPY",     # numpy
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
    "PERF",    # perflint
    "PT",      # pytest style
    "N",       # pep8-naming (see docs/conventions.md)
]
ignore = [
    # Long lines: `ruff format` wraps code; what is left is argparse help
    # text, docstrings and URLs, which are user-facing output and stay as written.
    "E501",
    # %-formatting -> f-strings.  ~280 sites, many build the tab-separated result
    # files that the golden tests compare byte-for-byte; a mass rewrite is not
    # behavior-neutral to review.  Revisit in a dedicated change.
    "UP031",
    # Unused unpacked names (`a, b, c = f()`): renaming to `_` is churn with no
    # benefit, and the unpacking documents the return shape of the numerics code.
    "RUF059",
    # `assert a and b` -> two asserts: churn in ~40 tests; the messages are the same.
    "PT018",
    # File handles are kept open on `self` by the genotype iterators (input.py)
    # and closed by their own close(); a `with` block would change the lifetime.
    "SIM115",
    # Ternary rewrites often read worse than the if/else in the numerics code.
    "SIM108",
    # zip(strict=True) would add a new runtime failure mode; not behavior-neutral.
    "B905",
    # Manual loops that append with side effects or conditionals; the rewrite
    # is a readability call, not a lint fix.
    "PERF401",
]

[tool.ruff.lint.pep8-naming]
# Math symbols (docs/conventions.md): a single capital letter, optionally
# followed by digits, names a matrix or vector of the model (K, X, Y, X0, K2)
# and may be used as a parameter, local variable or attribute.  Every other
# name follows PEP 8.
ignore-names = ["[A-Z]", "[A-Z][0-9]", "[A-Z][0-9][0-9]"]
