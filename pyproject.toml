[build-system]
# 1.27: first hatchling that accepts the PEP 639 `license-files` list form.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pylmm"
version = "1.0.0"
description = "A modern, readable, validated mixed-model toolkit for statistical genetics, built to be used by humans and agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Furlotte", email = "nick.furlotte@gmail.com" }]
keywords = [
    "GWAS",
    "linear mixed model",
    "LMM",
    "heritability",
    "kinship",
    "statistical genetics",
    "association mapping",
    "PLINK",
]
requires-python = ">=3.11"
# Lower bounds are the oldest releases with Python 3.11 wheels, and they are
# tested: CI runs `uv run --python 3.11 --resolution lowest-direct pytest` on
# ubuntu, which installs numpy 1.23.2 + scipy 1.9.2; the same pins also pass on
# macOS arm64.  Among supported Pythons, only 3.11 can resolve releases this
# old; newer Pythons resolve newer releases anyway.
dependencies = [
    "numpy>=1.23.2",
    "scipy>=1.9.2",
]
# The license is given by the PEP 639 `license` expression above; PEP 639
# deprecates "License ::" classifiers, so there is none here.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.optional-dependencies]
# PLINK 2 PGEN genotypes (`pylmm gwas --pfile`, `pylmm.pgen.PgenSource`): pgenlib, plink2's own
# reader, LGPL-3.0-only (pylmm is MIT).  Optional, imported only when a PGEN file is read; without it
# pylmm installs and works as before.  The floors are the first releases with wheels for that
# Python: 0.92.1 for 3.11-3.13, 0.94.0 for 3.14.  pgenlib has wheels for manylinux (x86-64,
# aarch64) and macOS only; elsewhere (Windows, musllinux) pip builds it, which needs a C++
# compiler.  CI runs the PGEN tests with the locked version on every supported Python.
pgen = [
    "pgenlib>=0.92.1; python_version < '3.14'",
    "pgenlib>=0.94.0; python_version >= '3.14'",
]

[project.urls]
Homepage = "https://github.com/nickFurlotte/pylmm"
Repository = "https://github.com/nickFurlotte/pylmm"
Issues = "https://github.com/nickFurlotte/pylmm/issues"
Changelog = "https://github.com/nickFurlotte/pylmm/blob/main/CHANGELOG.md"

[project.scripts]
pylmm = "pylmm.cli:main"

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff==0.15.*",
    "mypy==2.4.0",
]
sims = [
    "matplotlib>=3.5",
    "pandas>=1.4",
    "statsmodels>=0.13",
]
# Executes notebooks/pylmm_tour.ipynb (tests/test_notebook.py); not installed by default.
notebooks = [
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "nbformat>=5.10",
]

[tool.hatch.build.targets.wheel]
packages = ["pylmm"]

[tool.hatch.build.targets.sdist]
# The package, its metadata and the sources that need no data: sims/ (code
# only, not its result tables), skills/ and the notebook, plus the docs that
# skills/ and AGENTS.md link to (docs/migration/ is read by the
# migrate-from-old-pylmm script), and the contributor and security notes.
# Of data/ (~215MB) only its README (provenance and licence); not tests/,
# which needs tests/golden and data/.  An explicit list, because
# hatchling walks the .claude/skills symlink before skills/ and then skips
# skills/ as already seen.
only-include = [
    "pylmm",
    "sims",
    "skills",
    "notebooks",
    "docs/migration",
    "docs/guide.md",
    "docs/conventions.md",
    "docs/replication.md",
    "docs/phase4-simulations.md",
    "data/README.md",
    "AGENTS.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
]
exclude = ["/sims/results"]

[tool.mypy]
# The whole package, including the command line (pylmm/cli/).  numpy ships its own stubs; scipy has none (the
# third-party scipy-stubs package requires a newer numpy than the
# numpy>=1.23.2 floor), so its imports are untyped.  Run it under Python 3.11
# (`just typecheck`), the floor, and 3.14.
files = ["pylmm"]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# matplotlib (sims group only) is imported lazily by LMM.plot_fit; pgenlib (the pgen extra, a
# compiled module without stubs) lazily by pylmm.pgen.
module = ["scipy", "scipy.*", "matplotlib", "matplotlib.*", "pgenlib"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    # Runs under the Python 2.7 baseline image (docker/py27/); must stay py2-valid.
    "tests/golden/generate_golden.py",
    "tests/golden/py2_original",
    "data",
    # Teaching notebook: scripts-style cells (imports mid-file, multiple statements per line).
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "NPY",     # numpy
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
    "PERF",    # perflint
    "PT",      # pytest style
    "N",       # pep8-naming (see docs/conventions.md)
]
ignore = [
    # Long lines: `ruff format` wraps code; what is left is argparse help
    # text, docstrings and URLs, which are user-facing output and stay as written.
    "E501",
    # %-formatting -> f-strings.  ~280 sites, many build the tab-separated result
    # files that the golden tests compare byte-for-byte; a mass rewrite is not
    # behavior-neutral to review.  Revisit in a dedicated change.
    "UP031",
    # Unused unpacked names (`a, b, c = f()`): renaming to `_` is churn with no
    # benefit, and the unpacking documents the return shape of the numerics code.
    "RUF059",
    # `assert a and b` -> two asserts: churn in ~40 tests; the messages are the same.
    "PT018",
    # File handles are kept open on `self` by the genotype iterators (input.py)
    # and closed by their own close(); a `with` block would change the lifetime.
    "SIM115",
    # Ternary rewrites often read worse than the if/else in the numerics code.
    "SIM108",
    # zip(strict=True) would add a new runtime failure mode; not behavior-neutral.
    "B905",
    # Manual loops that append with side effects or conditionals; the rewrite
    # is a readability call, not a lint fix.
    "PERF401",
]

[tool.ruff.lint.pep8-naming]
# Math symbols (docs/conventions.md): a single capital letter, optionally
# followed by digits, names a matrix or vector of the model (K, X, Y, X0, K2)
# and may be used as a parameter, local variable or attribute.  Every other
# name follows PEP 8.
ignore-names = ["[A-Z]", "[A-Z][0-9]", "[A-Z][0-9][0-9]"]
