[pytest]
# pylmm/ is collected for its docstring examples (--doctest-modules), the CLI
# modules included; tests/golden/ holds the py2.7 golden-generation scripts,
# which are not importable under py3.
testpaths = tests pylmm
markers =
    slow: long-running test, skipped unless --runslow is given
# -p no:cacheprovider: no .pytest_cache/ written into the bind-mounted repo
addopts = -ra -p no:cacheprovider --doctest-modules --ignore=tests/golden
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
