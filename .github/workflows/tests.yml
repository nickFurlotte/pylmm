name: tests

on:
  push:
    # phase6: the integration branch for the next release (Phase 6 PRs merge there first).
    branches: [main, master, phase6]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ruff check
        run: uv run --locked ruff check

      - name: Ruff format check
        run: uv run --locked ruff format --check

  typecheck:
    # mypy on the whole package, the command line (pylmm/cli/) included, on
    # Python 3.11 (the floor) and on the newest Python (3.14), which catches
    # numpy stub drift.
    name: typecheck (mypy, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: mypy
        run: uv run --locked mypy --python-version ${{ matrix.python-version }}

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Same single-threaded BLAS setting as the py27 baseline image.
      OPENBLAS_NUM_THREADS: "1"
    steps:
      # NOTE: every job clones the ~215MB example data in data/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the v1.0.0 tag: tests/test_legacy_fit.py runs pylmm 1.0.0 from it
          fetch-depth: 0
          fetch-tags: true

      # Actions are pinned to full commit SHAs (the comment names the release);
      # Dependabot (.github/dependabot.yml) proposes updates monthly.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Slow full-dataset tests are skipped unless --runslow is given.
      # pytest.ini adds --doctest-modules, so the pylmm/ docstring examples
      # run here and in the lowest-direct job too.
      # tests/test_docs.py runs every code block of README.md, AGENTS.md, docs/guide.md and
      # skills/ (the summary lists executed and skipped blocks), here and in the
      # lowest-direct job.
      # The py27 Docker baseline (docker/py27/) is kept for reference only
      # and is not run in CI.
      # --group sims adds pandas/matplotlib/statsmodels for the sims/ tests
      # (they skip the parts needing those packages when the group is absent,
      # as in the lowest-direct job below).
      # --extra pgen installs the optional PGEN reader (pgenlib), so tests/test_pgen.py runs
      # here on every Python; the lowest-direct job has no extras, and the PGEN genotype
      # tests skip there (the "pgenlib not installed" lines of the -ra summary).
      - name: Run tests
        run: uv run --locked --group sims --extra pgen pytest

      - name: Simulation framework smoke run
        run: uv run --locked --group sims python -m sims run example_null --quick --report

      - name: Console entry points
        run: |
          uv run --locked pylmm --version
          uv run --locked pylmm gwas --help
          uv run --locked pylmm kinship --help
          uv run --locked python -m pylmm --help

  notebook:
    # Runs notebooks/pylmm_tour.ipynb top to bottom (not part of the matrix).
    name: notebook (Python 3.13)
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Execute the tour notebook
        run: uv run --locked --group sims --group notebooks pytest -q tests/test_notebook.py

  lowest-direct:
    # Checks the numpy/scipy lower bounds in pyproject.toml.  Not --locked:
    # this job resolves the oldest allowed direct dependencies instead.
    name: pytest (Python 3.11, lowest-direct)
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      # NOTE: clones the ~215MB example data too; see the pytest job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the v1.0.0 tag: tests/test_legacy_fit.py fails without it when CI is set
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.11"

      - name: Show resolved versions
        run: uv run --resolution lowest-direct python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"

      # Diagnostics for a one-off failure on this job (old numpy's OpenBLAS
      # returned wrong matrix products on one runner): record the CPU and the
      # BLAS build and core type, so a recurrence can be matched to hardware.
      # If it recurs, set OPENBLAS_CORETYPE=Haswell for this job only.
      - name: Show CPU and BLAS
        run: |
          lscpu
          uv run --resolution lowest-direct --with "threadpoolctl>=3.1" python -c "import json, numpy, threadpoolctl; print(json.dumps(threadpoolctl.threadpool_info(), indent=1))"

      - name: Run tests
        run: uv run --resolution lowest-direct pytest
